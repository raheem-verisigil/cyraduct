<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050">
  <rect width="1200" height="1050" fill="white"/>

  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Cyraduct Architecture</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Consequence control between AI decisions and real-world execution</text>

  <rect x="350" y="125" width="500" height="85" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
  <text x="600" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">AI AGENT</text>
  <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374151">Decision / proposed action</text>

  <line x1="600" y1="210" x2="600" y2="260" stroke="#111827" stroke-width="4"/>
  <polygon points="600,275 588,252 612,252" fill="#111827"/>

  <rect x="350" y="275" width="500" height="85" rx="14" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
  <text x="600" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">ACTION PROPOSAL</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374151">What the agent wants to execute</text>

  <line x1="600" y1="360" x2="600" y2="410" stroke="#111827" stroke-width="4"/>
  <polygon points="600,425 588,402 612,402" fill="#111827"/>

  <rect x="275" y="425" width="650" height="150" rx="14" fill="#eef2ff" stroke="#111827" stroke-width="3"/>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">CONSEQUENCE EVALUATION</text>

  <rect x="305" y="490" width="175" height="55" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
  <text x="392" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Evidence</text>

  <rect x="512" y="490" width="175" height="55" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
  <text x="600" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Policy</text>

  <rect x="720" y="490" width="175" height="55" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
  <text x="807" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Authorization</text>

  <line x1="600" y1="575" x2="600" y2="625" stroke="#111827" stroke-width="4"/>
  <polygon points="600,640 588,617 612,617" fill="#111827"/>

  <rect x="350" y="640" width="500" height="85" rx="14" fill="#ecfdf5" stroke="#111827" stroke-width="3"/>
  <text x="600" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">SIGNED RECEIPT</text>
  <text x="600" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374151">Cryptographically verifiable authorization</text>

  <line x1="600" y1="725" x2="600" y2="775" stroke="#111827" stroke-width="4"/>
  <polygon points="600,790 588,767 612,767" fill="#111827"/>

  <rect x="350" y="790" width="500" height="90" rx="14" fill="#fff7ed" stroke="#111827" stroke-width="3"/>
  <text x="600" y="827" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">ENFORCEMENT BROKER</text>
  <text x="600" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#374151">Independent validation before execution</text>

  <line x1="475" y1="880" x2="300" y2="940" stroke="#111827" stroke-width="4"/>
  <polygon points="285,945 307,928 300,950" fill="#111827"/>
  <line x1="725" y1="880" x2="900" y2="940" stroke="#111827" stroke-width="4"/>
  <polygon points="915,945 893,928 900,950" fill="#111827"/>

  <rect x="120" y="945" width="330" height="75" rx="14" fill="#ecfdf5" stroke="#166534" stroke-width="3"/>
  <text x="285" y="975" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">ALLOW</text>
  <text x="285" y="1000" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">→ Execution sink</text>

  <rect x="750" y="945" width="330" height="75" rx="14" fill="#fef2f2" stroke="#991b1b" stroke-width="3"/>
  <text x="915" y="975" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">REJECT</text>
  <text x="915" y="1000" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">→ Action prevented</text>
</svg>
