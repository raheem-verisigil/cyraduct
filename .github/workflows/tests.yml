name: Cyraduct tests

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q app main.py verify_receipt.py
      - name: Run test suite
        env:
          CYRADUCT_ENV: test
          PYTHONPATH: .
        run: pytest -q
