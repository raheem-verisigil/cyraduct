name: Cyraduct LangGraph integration

on:
  push:
    branches: ["integration/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  langgraph-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYRADUCT_ENV: test
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core and integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-langgraph.txt pytest pytest-asyncio
      - name: Compile integration modules
        run: python -m compileall -q integrations
      - name: Run LangGraph integration tests
        run: pytest -q tests/integrations/test_langgraph_cyraduct.py
